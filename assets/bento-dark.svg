<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 624" role="img" aria-labelledby="t d">
  <title id="t">Emre Erim — designer &amp; engineer</title>
  <desc id="d">Bento grid profile card. Emre Erim, designer and engineer: interfaces with intent.
  Available for new projects. Based in Konya, Turkey, UTC+3. Three pillars: design, engineering, craft.
  Site: erim.digital.</desc>
  <defs>
    <style>
      .sans { font-family:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
      .mono { font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace; }
      .ink { fill:#F5F5F2; }
      .muted { fill:#8B9099; }
      .card { opacity:0; animation:rise .7s cubic-bezier(.16,1,.3,1) both; }
      .in { opacity:0; animation:fade .8s ease-out both; }
      @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
      @keyframes fade { to { opacity:1; } }
      .pulse { animation:pulse 2.4s ease-in-out infinite; transform-origin:928px 64px; }
      @keyframes pulse { 0%,100% { opacity:.55; transform:scale(1); } 50% { opacity:0; transform:scale(2.4); } }
      .orbit { animation:spin 24s linear infinite; transform-origin:1088px 300px; }
      @keyframes spin { to { transform:rotate(360deg); } }
      @media (prefers-reduced-motion:reduce) {
        .card,.in { animation:none; opacity:1; } .pulse,.orbit { animation:none; }
      }
    </style>
    <radialGradient id="glow" cx="0.92" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#C7F551" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C7F551" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#2A2E34"/>
    </pattern>
    <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
    <mask id="dotmask"><rect x="560" y="24" width="324" height="340" fill="url(#fadeR)"/></mask>
    <clipPath id="heroclip"><rect x="24" y="24" width="860" height="340" rx="22"/></clipPath>
  </defs>

  <!-- HERO -->
  <rect class="card" style="animation-delay:0s" x="24" y="24" width="860" height="340" rx="22" fill="#0F1114" stroke="#23262B"/>
  <g class="in" style="animation-delay:.1s" clip-path="url(#heroclip)">
    <rect x="24" y="24" width="860" height="340" fill="url(#glow)"/>
    <rect x="560" y="24" width="324" height="340" fill="url(#dots)" mask="url(#dotmask)"/>
  </g>
  <g class="in" style="animation-delay:.15s">
    <text x="60" y="76" class="mono muted" font-size="12" letter-spacing="2.4">EMRE ERIM — PROFILE / V07</text>
    <text x="56" y="232" class="sans ink" font-size="118" font-weight="700" letter-spacing="-5">Emre Erim<tspan fill="#C7F551">.</tspan></text>
    <text x="60" y="290" class="sans ink" font-size="24" font-weight="500" letter-spacing="-0.4">Designer &amp; engineer.</text>
    <text x="60" y="322" class="sans muted" font-size="24" letter-spacing="-0.4">Interfaces with intent — from first sketch to shipped code.</text>
  </g>

  <!-- STATUS -->
  <rect class="card" style="animation-delay:0.12s" x="900" y="24" width="276" height="162" rx="22" fill="#0F1114" stroke="#23262B"/>
  <g class="in" style="animation-delay:.2s">
    <circle class="pulse" cx="928" cy="64" r="6" fill="#C7F551"/>
    <circle cx="928" cy="64" r="6" fill="#C7F551"/>
    <text x="944" y="68" class="mono muted" font-size="12" letter-spacing="2.4">STATUS</text>
    <text x="924" y="128" class="sans ink" font-size="26" font-weight="650" letter-spacing="-0.6">Available</text>
    <text x="924" y="156" class="sans muted" font-size="15">for new projects · MMXXVI</text>
  </g>

  <!-- LOCATION -->
  <rect class="card" style="animation-delay:0.2s" x="900" y="202" width="276" height="162" rx="22" fill="#0F1114" stroke="#23262B"/>
  <g class="in" style="animation-delay:.28s">
    <text x="924" y="246" class="mono muted" font-size="12" letter-spacing="2.4">BASED IN</text>
    <text x="924" y="306" class="sans ink" font-size="26" font-weight="650" letter-spacing="-0.6">Konya, TR</text>
    <text x="924" y="334" class="mono muted" font-size="13">UTC+03:00</text>
    <circle cx="1112" cy="300" r="34" fill="none" stroke="#2A2E34" stroke-width="1.5"/>
    <circle cx="1112" cy="300" r="20" fill="none" stroke="#2A2E34" stroke-width="1.5" stroke-dasharray="3 4"/>
    <circle cx="1112" cy="300" r="4" fill="#C7F551"/>
    <g class="orbit" style="transform-origin:1112px 300px"><circle cx="1146" cy="300" r="3" fill="#F5F5F2"/></g>
  </g>

  <!-- PILLARS -->
  <rect class="card" style="animation-delay:0.35s" x="24" y="380" width="276" height="220" rx="22" fill="#0F1114" stroke="#23262B"/><g class="in" style="animation-delay:0.39999999999999997s"><text x="52" y="426" class="mono muted" font-size="12" letter-spacing="2">01 /</text><text x="52" y="526" class="sans ink" font-size="30" font-weight="650" letter-spacing="-0.8">Design</text><text x="52" y="556" class="sans muted" font-size="15">Interfaces, systems and</text><text x="52" y="577" class="sans muted" font-size="15">the details in between.</text></g><rect class="card" style="animation-delay:0.43s" x="316" y="380" width="276" height="220" rx="22" fill="#0F1114" stroke="#23262B"/><g class="in" style="animation-delay:0.48s"><text x="344" y="426" class="mono muted" font-size="12" letter-spacing="2">02 /</text><text x="344" y="526" class="sans ink" font-size="30" font-weight="650" letter-spacing="-0.8">Engineering</text><text x="344" y="556" class="sans muted" font-size="15">Front-end that ships the</text><text x="344" y="577" class="sans muted" font-size="15">design intact.</text></g><rect class="card" style="animation-delay:0.51s" x="608" y="380" width="276" height="220" rx="22" fill="#0F1114" stroke="#23262B"/><g class="in" style="animation-delay:0.56s"><text x="636" y="426" class="mono muted" font-size="12" letter-spacing="2">03 /</text><text x="636" y="526" class="sans ink" font-size="30" font-weight="650" letter-spacing="-0.8">Craft</text><text x="636" y="556" class="sans muted" font-size="15">Motion, type and polish.</text><text x="636" y="577" class="sans muted" font-size="15">No step skipped.</text></g>

  <!-- SITE (accent) -->
  <rect class="card" style="animation-delay:0.6s" x="900" y="380" width="276" height="220" rx="22" fill="#C7F551" stroke="#C7F551"/>
  <g class="in" style="animation-delay:.68s">
    <text x="928" y="426" class="mono" fill="#0B0B0C" fill-opacity=".6" font-size="12" letter-spacing="2.4">SITE</text>
    <path d="M1124 410 L1148 410 L1148 434 M1148 410 L1120 438" fill="none" stroke="#0B0B0C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="928" y="526" class="sans" fill="#0B0B0C" font-size="30" font-weight="700" letter-spacing="-1">erim.digital</text>
    <text x="928" y="556" class="sans" fill="#0B0B0C" fill-opacity=".65" font-size="15">Selected work &amp; contact</text>
  </g>
</svg>
